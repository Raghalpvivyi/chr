<style>
  html, body { margin:0; height:100%; overflow:hidden; background: radial-gradient(ellipse at center, #06121a 0%, #000 80%); font-family:'Cairo', sans-serif; }
  #container { position:absolute; inset:0; }
  .element {
    width:120px; height:160px; box-sizing:border-box; direction:rtl; text-align:center; cursor:default;
    background:rgba(0,12,16,0.85);
    border:1px solid rgba(0,255,200,0.55);
    box-shadow:0 0 12px rgba(0,255,200,0.35), inset 0 0 14px rgba(0,255,170,0.15);
    border-radius:6px; position:relative; color:#aafff0; transition:box-shadow .25s, background .25s;
  }
  .element:hover { background:rgba(0,60,50,0.9); box-shadow:0 0 28px rgba(0,255,200,0.95), inset 0 0 20px rgba(0,255,170,0.4); }
  .element .number { position:absolute; top:6px; right:8px; font-size:13px; color:#7dffb5; }
  .element .symbol { position:absolute; top:34px; left:0; right:0; font-family:'Orbitron', sans-serif; font-size:52px; font-weight:700; color:#fff; text-shadow:0 0 10px #00ffd0, 0 0 22px #00ff88; }
  .element .details { position:absolute; bottom:8px; left:0; right:0; font-size:14px; font-weight:700; color:#00ffd0; line-height:1.3; }
  .element .details small { display:block; font-size:11px; font-weight:400; color:#8fe8d8; direction:ltr; }
  #menu { position:absolute; bottom:22px; left:0; right:0; display:flex; justify-content:center; gap:12px; z-index:10; direction:rtl; }
  #menu button {
    font-family:'Cairo', sans-serif; font-size:16px; font-weight:700; padding:10px 26px; cursor:pointer;
    color:#00ffd0; background:rgba(0,20,25,0.75); border:1px solid rgba(0,255,200,0.7); border-radius:6px;
    box-shadow:0 0 10px rgba(0,255,200,0.4); transition:all .2s;
  }
  #menu button:hover, #menu button.active { background:rgba(0,255,200,0.85); color:#00181a; box-shadow:0 0 22px rgba(0,255,200,0.9); }
  #title { position:absolute; top:16px; width:100%; text-align:center; color:#00ffd0; font-size:22px; font-weight:700; text-shadow:0 0 12px #00ffd0; z-index:10; pointer-events:none; }
</style>
</head>
<body>
<div id="title">الجدول الدوري التفاعلي</div>
<div id="container"></div>
<div id="menu">
  <button id="table" class="active">جدول</button>
  <button id="sphere">كرة</button>
  <button id="helix">حلزوني</button>
  <button id="grid">شبكة</button>
</div>

  ["Og","أوغانيسون",294,18,7]

let camera, scene, renderer, controls;
const objects = [];
const targets = { table: [], sphere: [], helix: [], grid: [] };

init();
animate();

function init() {
  camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 10000);
  camera.position.z = 3000;

  scene = new THREE.Scene();

  // إنشاء البطاقات
  for (let i = 0; i < elements.length; i++) {
    const e = elements[i];
    const div = document.createElement('div');
    div.className = 'element';
    div.innerHTML =
      '<div class="number">' + (i + 1) + '</div>' +
      '<div class="symbol">' + e[0] + '</div>' +
      '<div class="details">' + e[1] + '<small>' + e[2] + '</small></div>';

    const obj = new THREE.CSS3DObject(div);
    obj.position.set(Math.random() * 4000 - 2000, Math.random() * 4000 - 2000, Math.random() * 4000 - 2000);
    scene.add(obj);
    objects.push(obj);

    // Table
    const t = new THREE.Object3D();
    t.position.x = (e[3] * 140) - 1330;
    t.position.y = -(e[4] * 180) + 990;
    targets.table.push(t);
  }

  // Sphere
  const vector = new THREE.Vector3();
  const l = objects.length;
  for (let i = 0; i < l; i++) {
    const phi = Math.acos(-1 + (2 * i) / l);
    const theta = Math.sqrt(l * Math.PI) * phi;
    const o = new THREE.Object3D();
    o.position.setFromSphericalCoords(800, phi, theta);
    vector.copy(o.position).multiplyScalar(2);
    o.lookAt(vector);
    targets.sphere.push(o);
  }

  // Helix
  for (let i = 0; i < l; i++) {
    const theta = i * 0.175 + Math.PI;
    const y = -(i * 8) + 450;
    const o = new THREE.Object3D();
    o.position.setFromCylindricalCoords(900, theta, y);
    vector.x = o.position.x * 2;
    vector.y = o.position.y;
    vector.z = o.position.z * 2;
    o.lookAt(vector);
    targets.helix.push(o);
  }

  // Grid
  for (let i = 0; i < l; i++) {
    const o = new THREE.Object3D();
    o.position.x = ((i % 5) * 400) - 800;
    o.position.y = (-(Math.floor(i / 5) % 4) * 400) + 800;
    o.position.z = (Math.floor(i / 20)) * 1000 - 2500;
    targets.grid.push(o);
  }

  renderer = new THREE.CSS3DRenderer();
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.getElementById('container').appendChild(renderer.domElement);

  controls = new THREE.TrackballControls(camera, renderer.domElement);
  controls.minDistance = 500;
  controls.maxDistance = 6000;
  controls.rotateSpeed = 2.0;
  controls.zoomSpeed = 1.0;

  // الأزرار
  ['table', 'sphere', 'helix', 'grid'].forEach(function (name) {
    document.getElementById(name).addEventListener('click', function () {
      document.querySelectorAll('#menu button').forEach(function (b) { b.classList.remove('active'); });
      this.classList.add('active');
      transform(targets[name], 2000);
    });
  });

  transform(targets.table, 2000);
  window.addEventListener('resize', onWindowResize);
}

function transform(target, duration) {
  TWEEN.removeAll();
  for (let i = 0; i < objects.length; i++) {
    const object = objects[i];
    const t = target[i];

    new TWEEN.Tween(object.position)
      .to({ x: t.position.x, y: t.position.y, z: t.position.z }, Math.random() * duration + duration)
      .easing(TWEEN.Easing.Exponential.InOut)
      .start();

    new TWEEN.Tween(object.rotation)
      .to({ x: t.rotation.x, y: t.rotation.y, z: t.rotation.z }, Math.random() * duration + duration)
      .easing(TWEEN.Easing.Exponential.InOut)
      .start();
  }
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  controls.handleResize();
}

function animate() {
  requestAnimationFrame(animate);
  TWEEN.update();
  controls.update();
  renderer.render(scene, camera);
}
