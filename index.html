<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>الجدول الدوري التفاعلي ثلاثي الأبعاد</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

        body {
            margin: 0;
            background-color: #000000;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
            background: radial-gradient(circle at center, #001111 0%, #000000 100%);
        }

        a {
            color: #00ffff;
        }

        #menu {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            z-index: 100;
        }

        button {
            color: rgba(127, 255, 255, 0.75);
            background: transparent;
            outline: 1px solid rgba(127, 255, 255, 0.75);
            border: 0px;
            padding: 10px 25px;
            margin: 0 10px;
            cursor: pointer;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            border-radius: 5px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }

        button:hover {
            background-color: rgba(0, 255, 255, 0.5);
            color: #ffffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
            outline: 1px solid rgba(255, 255, 255, 0.75);
        }

        button:active {
            color: #000000;
            background-color: rgba(0, 255, 255, 1);
        }

        .element {
            width: 120px;
            height: 160px;
            box-shadow: 0px 0px 12px rgba(0, 255, 255, 0.5);
            border: 1px solid rgba(127, 255, 255, 0.25);
            font-family: 'Cairo', sans-serif;
            text-align: center;
            cursor: default;
            transition: box-shadow 0.3s ease, border 0.3s ease;
            background-color: rgba(0, 40, 40, 0.75);
            border-radius: 8px;
        }

        .element:hover {
            box-shadow: 0px 0px 20px rgba(0, 255, 255, 0.9);
            border: 1px solid rgba(127, 255, 255, 0.75);
            z-index: 1;
        }

        .element .number {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 14px;
            color: rgba(127, 255, 255, 0.9);
            font-weight: bold;
        }

        .element .symbol {
            position: absolute;
            top: 40px;
            left: 0px;
            right: 0px;
            font-size: 50px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
            direction: ltr;
        }

        .element .details {
            position: absolute;
            bottom: 10px;
            left: 0px;
            right: 0px;
            font-size: 13px;
            color: rgba(127, 255, 255, 0.8);
            line-height: 1.2;
        }

        #container {
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>

    <!-- Import maps polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@tweenjs/tween.js": "https://unpkg.com/@tweenjs/tween.js@23.1.1/dist/tween.esm.js"
            }
        }
    </script>
</head>

            "No", "نوبليوم", "259", 17, 10,
            "Lr", "لورنسيوم", "262", 18, 10,
            "Rf", "رذرفورديوم", "267", 4, 7,
            "Db", "دوبنيوم", "268", 5, 7,
            "Sg", "سيبورغيوم", "269", 6, 7,
            "Bh", "بوريوم", "270", 7, 7,
            "Hs", "هاسيوم", "270", 8, 7,
            "Mt", "مايتنريوم", "278", 9, 7,
            "Ds", "دارْمشتاتيوم", "281", 10, 7,
            "Rg", "رونتجينيوم", "281", 11, 7,
            "Cn", "كوبرنيسيوم", "285", 12, 7,
            "Nh", "نيهونيوم", "286", 13, 7,
            "Fl", "فليروفيوم", "289", 14, 7,
            "Mc", "موسكوفيوم", "289", 15, 7,
            "Lv", "ليفرموريوم", "293", 16, 7,
            "Ts", "تينيسين", "294", 17, 7,
            "Og", "أوغانيسون", "294", 18, 7
        ];

        let camera, scene, renderer, controls;
        const objects = [];
        const targets = { table: [], sphere: [], helix: [], grid: [] };

        init();
        animate();

        function init() {
            camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 1, 10000 );
            camera.position.z = 3000;

            scene = new THREE.Scene();

            // إنشاء البطاقات (Elements) وتوزيعها العشوائي الأولي
            for ( let i = 0; i < tableData.length; i += 5 ) {
                const element = document.createElement( 'div' );
                element.className = 'element';
                
                const atomicNumber = ( i / 5 ) + 1;
                
                const number = document.createElement( 'div' );
                number.className = 'number';
                number.textContent = atomicNumber;
                element.appendChild( number );

                const symbol = document.createElement( 'div' );
                symbol.className = 'symbol';
                symbol.textContent = tableData[ i ];
                element.appendChild( symbol );

                const details = document.createElement( 'div' );
                details.className = 'details';
                details.innerHTML = tableData[ i + 1 ] + '<br>' + tableData[ i + 2 ];
                element.appendChild( details );

                const objectCSS = new CSS3DObject( element );
                objectCSS.position.x = Math.random() * 4000 - 2000;
                objectCSS.position.y = Math.random() * 4000 - 2000;
                objectCSS.position.z = Math.random() * 4000 - 2000;
                scene.add( objectCSS );
                objects.push( objectCSS );

                // هدف الجدول (Table)
                const objectTable = new THREE.Object3D();
                objectTable.position.x = ( tableData[ i + 3 ] * 140 ) - 1330;
                objectTable.position.y = - ( tableData[ i + 4 ] * 180 ) + 990;
                targets.table.push( objectTable );
            }

            // هدف الكرة (Sphere)
            const vector = new THREE.Vector3();
            for ( let i = 0, l = objects.length; i < l; i ++ ) {
                const phi = Math.acos( - 1 + ( 2 * i ) / l );
                const theta = Math.sqrt( l * Math.PI ) * phi;
                const objectSphere = new THREE.Object3D();
                objectSphere.position.setFromSphericalCoords( 800, phi, theta );
                vector.copy( objectSphere.position ).multiplyScalar( 2 );
                objectSphere.lookAt( vector );
                targets.sphere.push( objectSphere );
            }

            // هدف الحلزون (Helix)
            for ( let i = 0, l = objects.length; i < l; i ++ ) {
                const theta = i * 0.175 + Math.PI;
                const y = - ( i * 8 ) + 450;
                const objectHelix = new THREE.Object3D();
                objectHelix.position.setFromCylindricalCoords( 900, theta, y );
                vector.x = objectHelix.position.x * 2;
                vector.y = objectHelix.position.y;
                vector.z = objectHelix.position.z * 2;
                objectHelix.lookAt( vector );
                targets.helix.push( objectHelix );
            }

            // هدف الشبكة (Grid)
            for ( let i = 0; i < objects.length; i ++ ) {
                const objectGrid = new THREE.Object3D();
                objectGrid.position.x = ( ( i % 5 ) * 400 ) - 800;
                objectGrid.position.y = ( - ( Math.floor( i / 5 ) % 5 ) * 400 ) + 800;
                objectGrid.position.z = ( Math.floor( i / 25 ) ) * 1000 - 2000;
                targets.grid.push( objectGrid );
            }

            // إعداد العارض (Renderer)
            renderer = new CSS3DRenderer();
            renderer.setSize( window.innerWidth, window.innerHeight );
            document.getElementById( 'container' ).appendChild( renderer.domElement );

            // إعداد التحكم (TrackballControls)
            controls = new TrackballControls( camera, renderer.domElement );
            controls.minDistance = 500;
            controls.maxDistance = 6000;
            controls.addEventListener( 'change', render );

            // إعداد الأزرار
            const buttonTable = document.getElementById( 'table' );
            buttonTable.addEventListener( 'click', function () { transform( targets.table, 2000 ); } );

            const buttonSphere = document.getElementById( 'sphere' );
            buttonSphere.addEventListener( 'click', function () { transform( targets.sphere, 2000 ); } );

            const buttonHelix = document.getElementById( 'helix' );
            buttonHelix.addEventListener( 'click', function () { transform( targets.helix, 2000 ); } );

            const buttonGrid = document.getElementById( 'grid' );
            buttonGrid.addEventListener( 'click', function () { transform( targets.grid, 2000 ); } );

            // البدء بعرض الجدول
            transform( targets.table, 2000 );

            window.addEventListener( 'resize', onWindowResize );
        }

        // دالة تحريك العناصر باستخدام TWEEN
        function transform( targets, duration ) {
            TWEEN.removeAll();
            for ( let i = 0; i < objects.length; i ++ ) {
                const object = objects[ i ];
                const target = targets[ i ];

                new TWEEN.Tween( object.position )
                    .to( { x: target.position.x, y: target.position.y, z: target.position.z }, Math.random() * duration + duration )
                    .easing( TWEEN.Easing.Exponential.InOut )
                    .start();

                new TWEEN.Tween( object.rotation )
                    .to( { x: target.rotation.x, y: target.rotation.y, z: target.rotation.z }, Math.random() * duration + duration )
                    .easing( TWEEN.Easing.Exponential.InOut )
                    .start();
            }

            new TWEEN.Tween( this )
                .to( {}, duration * 2 )
                .onUpdate( render )
                .start();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize( window.innerWidth, window.innerHeight );
            render();
        }

        function animate() {
            requestAnimationFrame( animate );
            TWEEN.update();
            controls.update();
        }

        function render() {
            renderer.render( scene, camera );
        }
    </script>
</body>
</html>
